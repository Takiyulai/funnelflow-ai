<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Stratégique — FunnelFlow AI</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0F172A;
      --gold: #C7A436;
      --danger: #EF4444;
      --success: #10B981;
      --canvas: #F8FAFC;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--canvas);
      color: var(--navy);
    }
    h1, h2, h3 { font-family: 'Sora', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(15, 23, 42, 0.08);
    }
    .badge-critical { background: #FEE2E2; color: #991B1B; border: 1px solid #F87171; }
    .badge-ok { background: #D1FAE5; color: #065F46; border: 1px solid #34D399; }
    .sh-premium { box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.12); }
    .code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const StatusCard = ({ title, score, status, desc, items }) => (
      <div className="glass rounded-2xl p-6 sh-premium flex flex-col gap-4 animate-up">
        <div className="flex justify-between items-start">
          <h3 className="font-extrabold text-xl tracking-tight">{title}</h3>
          <span className={`px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest ${status === 'CRITIQUE' ? 'badge-critical' : 'badge-ok'}`}>
            {status}
          </span>
        </div>
        <div className="flex items-baseline gap-2">
          <span className="text-4xl font-black">{score}</span>
          <span className="text-slate-400 font-bold">/ 10</span>
        </div>
        <p className="text-sm text-slate-600 leading-relaxed font-medium">{desc}</p>
        <div className="space-y-2 mt-2">
          {items.map((item, i) => (
            <div key={i} className="flex items-center gap-3 text-sm">
              <span className={`w-2 h-2 rounded-full ${item.fail ? 'bg-danger' : 'bg-success'}`} />
              <span className={item.fail ? 'text-danger font-semibold' : 'text-slate-700'}>{item.text}</span>
            </div>
          ))}
        </div>
      </div>
    );

    const RefactorBlock = ({ title, before, after, impact }) => (
      <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden sh-premium animate-up">
        <div className="bg-slate-900 p-4 flex justify-between items-center">
          <h4 className="text-white font-bold text-sm tracking-wide uppercase">{title}</h4>
          <span className="text-gold text-[10px] font-black tracking-widest uppercase bg-gold/10 px-2 py-1 rounded">Impact: {impact}</span>
        </div>
        <div className="grid md:grid-cols-2 divide-x divide-slate-100">
          <div className="p-5">
            <span className="text-[10px] font-black text-slate-400 uppercase block mb-3">État Actuel (Problématique)</span>
            <pre className="code text-danger bg-red-50 p-3 rounded-lg overflow-x-auto">
              {before}
            </pre>
          </div>
          <div className="p-5 bg-slate-50/50">
            <span className="text-[10px] font-black text-success uppercase block mb-3">Solution Recommandée</span>
            <pre className="code text-success bg-green-50 p-3 rounded-lg overflow-x-auto">
              {after}
            </pre>
          </div>
        </div>
      </div>
    );

    const Dashboard = () => {
      return (
        <div className="max-w-6xl mx-auto px-6 py-12">
          {/* Header */}
          <header className="mb-16 flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
              <div className="flex items-center gap-3 mb-4">
                <div className="w-12 h-1 bg-gold rounded-full" />
                <span className="text-gold font-black uppercase tracking-[0.2em] text-xs">Rapport d'Audit Senior</span>
              </div>
              <h1 className="text-5xl font-black text-navy leading-none mb-4">
                FunnelFlow AI <br/>
                <span className="text-slate-400">Indestructible Edition.</span>
              </h1>
              <p className="text-slate-500 max-w-xl text-lg font-medium">
                Analyse technique et stratégique sans tabou pour une exportation fluide vers Systeme.io et une conversion maximale.
              </p>
            </div>
            <div className="glass p-4 rounded-2xl text-center min-w-[160px]">
              <div className="text-[10px] font-black text-slate-400 uppercase mb-1">Score Global</div>
              <div className="text-4xl font-black text-navy">6.2</div>
              <div className="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
                <div className="bg-gold h-full w-[62%]" />
              </div>
            </div>
          </header>

          {/* Key Metrics Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
            <StatusCard 
              title="Capture de Leads"
              score="2.0"
              status="CRITIQUE"
              desc="Le système actuel simule la capture mais ne stocke rien. C'est un 'vendeur sans carnet' : vos clients perdent 100% de leur trafic."
              items={[
                { text: "API leads volatile (pas de DB)", fail: true },
                { text: "Absence de sync CRM", fail: true },
                { text: "Formulaires HTML exportés OK", fail: false }
              ]}
            />
            <StatusCard 
              title="Export Systeme.io"
              score="5.5"
              status="FRAGILE"
              desc="Le code est propre et scopé, mais le flux d'export par 'blocs' est trop complexe pour un coach non-technique."
              items={[
                { text: "CSS scopé .ff-page", fail: false },
                { text: "Redirections hardcodées", fail: true },
                { text: "Multi-pasting chronophage", fail: true }
              ]}
            />
            <StatusCard 
              title="Qualité Génération"
              score="7.8"
              status="SOLIDE"
              desc="Les prompts sont excellents mais manquent de 'Mordant'. Le ton est parfois trop scolaire pour des entrepreneurs coachs."
              items={[
                { text: "Logique sémantique par rôle", fail: false },
                { text: "Protection anti-puces body", fail: false },
                { text: "Manque d'autorité d'expert", fail: true }
              ]}
            />
          </div>

          {/* Deep Dive: Redirections & Flux */}
          <section className="mb-16">
            <h2 className="text-3xl font-black mb-8 flex items-center gap-4">
              <span className="w-8 h-8 rounded-full bg-navy text-white flex items-center justify-center text-sm">01</span>
              Le Casse-Tête des Redirections
            </h2>
            <div className="space-y-6">
              <div className="glass p-8 rounded-2xl border-l-4 border-danger">
                <h3 className="font-bold text-xl mb-4 text-navy">L'Audit Sans Tabou : "Un tunnel qui ne mène nulle part"</h3>
                <p className="text-slate-600 mb-6 leading-relaxed">
                  Actuellement, si vous exportez une page d'Opt-in et une page de Merci, le bouton de l'Opt-in pointe vers <code className="bg-slate-100 px-1 rounded">/thank-you</code>. 
                  Mais dans <strong>Systeme.io</strong>, votre étape suivante aura une URL du type <code className="bg-slate-100 px-1 rounded">https://user.systeme.io/page-34821</code>.
                  <br/><br/>
                  <strong>Résultat :</strong> Le tunnel casse dès le premier clic après l'exportation. L'utilisateur doit modifier manuellement chaque bouton. C'est inacceptable pour une promesse "No-Code".
                </p>
                <RefactorBlock 
                  title="Gestion des Liens Dynamiques"
                  before={`// lib/funnels/cta.ts\nexport function ctaHref(cta) {\n  if (cta.mode === "redirect") {\n    return cta.url; // Mortel après export !\n  }\n  return "#lead-form";\n}`}
                  after={`// lib/funnels/cta.ts\nexport function ctaHref(cta, context) {\n  if (context === 'export-systeme') {\n    // Utilise les variables S.io ou placeholders\n    return cta.isNextStep ? "{{next_step_url}}" : cta.url;\n  }\n  return cta.url;\n}`}
                  impact="Haut (Fluidité post-export)"
                />
              </div>
            </div>
          </section>

          {/* Deep Dive: Leads */}
          <section className="mb-16">
            <h2 className="text-3xl font-black mb-8 flex items-center gap-4">
              <span className="w-8 h-8 rounded-full bg-navy text-white flex items-center justify-center text-sm">02</span>
              Sync CRM & Leads
            </h2>
            <div className="grid lg:grid-cols-2 gap-8">
              <div className="space-y-6">
                <p className="text-slate-600 leading-relaxed font-medium">
                  Un tunnel de vente sans base de données de leads est une page web morte. 
                  Votre API actuelle <code className="bg-slate-100 px-1 rounded">POST /api/leads</code> est un simple "echo".
                </p>
                <div className="p-6 bg-gold/5 border border-gold/20 rounded-2xl">
                  <h4 className="font-black text-gold uppercase text-xs tracking-widest mb-3">Roadmap Recommandée</h4>
                  <ul className="space-y-3">
                    <li className="flex gap-3 text-sm font-semibold">
                      <span className="text-gold">1.</span>
                      <span>Migration vers <strong>Supabase Table</strong> 'leads'</span>
                    </li>
                    <li className="flex gap-3 text-sm font-semibold">
                      <span className="text-gold">2.</span>
                      <span>Webhook sortant vers <strong>Zapier/Make</strong></span>
                    </li>
                    <li className="flex gap-3 text-sm font-semibold">
                      <span className="text-gold">3.</span>
                      <span>Intégration directe <strong>Systeme.io API</strong> pour auto-inscription</span>
                    </li>
                  </ul>
                </div>
              </div>
              <div className="glass p-6 rounded-2xl flex flex-col items-center justify-center text-center">
                <div className="w-16 h-16 bg-red-100 text-danger rounded-full flex items-center justify-center mb-4">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 17c-.77 1.333.192 3 1.732 3z"/></svg>
                </div>
                <h4 className="font-bold text-navy mb-2">Danger : Volatilité des données</h4>
                <p className="text-xs text-slate-500 max-w-xs">
                  Si un utilisateur ferme l'onglet avant d'avoir copié-collé ses leads (qu'il ne peut même pas voir pour l'instant), ils sont définitivement perdus.
                </p>
              </div>
            </div>
          </section>

          {/* AI Generation Quality */}
          <section className="mb-16">
            <h2 className="text-3xl font-black mb-8 flex items-center gap-4">
              <span className="w-8 h-8 rounded-full bg-navy text-white flex items-center justify-center text-sm">03</span>
              L'IA : Du Copywriting au "Storytelling d'Expert"
            </h2>
            <div className="bg-slate-900 rounded-3xl p-8 text-white sh-premium">
              <div className="grid md:grid-cols-2 gap-12">
                <div>
                  <h3 className="text-2xl font-black mb-4 italic">"Arrêtez de vendre, commencez à enseigner."</h3>
                  <p className="text-slate-400 mb-6 text-sm leading-relaxed">
                    Les coachs et formateurs (votre cible) ont besoin d'établir une <strong>Autorité Immédiate</strong>. 
                    Les prompts actuels sont trop axés sur le "produit" et pas assez sur la "transformation".
                  </p>
                  <div className="space-y-4">
                    <div className="flex gap-4 p-4 rounded-xl bg-white/5 border border-white/10 text-xs">
                      <div className="text-danger font-black">❌</div>
                      <div>
                        <span className="font-bold block mb-1">Actuel (Salesy)</span>
                        "Achetez ce guide pour booster vos revenus de 50% en un mois."
                      </div>
                    </div>
                    <div className="flex gap-4 p-4 rounded-xl bg-success/10 border border-success/20 text-xs">
                      <div className="text-success font-black">✅</div>
                      <div>
                        <span className="font-bold block mb-1">Recommandé (Expert Authority)</span>
                        "Le système exact que j'utilise pour stabiliser mon cashflow sans sacrifier mes week-ends."
                      </div>
                    </div>
                  </div>
                </div>
                <div className="flex flex-col justify-center gap-6">
                  <div className="p-6 bg-white/5 rounded-2xl border border-white/10">
                    <h4 className="text-gold font-black uppercase text-[10px] tracking-widest mb-4">Injection de prompt conseillée</h4>
                    <pre className="code text-blue-300 text-xs whitespace-pre-wrap">
                      {`"Agis comme un Consultant Senior avec 20 ans d'expérience. 
Utilise le framework PAS (Problem-Agitation-Solution) mais intègre une dose massive d'Empathie. 
Évite les superlatifs. Préfère les données froides et les promesses réalistes."`}
                    </pre>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Actionable Footer */}
          <footer className="mt-20 pt-12 border-t border-slate-200 flex flex-col items-center text-center">
            <h2 className="text-2xl font-black mb-4">Prêt à passer au niveau supérieur ?</h2>
            <p className="text-slate-500 mb-8 max-w-lg">
              Ces améliorations transformeront FunnelFlow AI d'un gadget de génération en un outil de production industriel pour les entrepreneurs sérieux.
            </p>
            <div className="flex gap-4">
              <button className="bg-navy text-white px-8 py-4 rounded-xl font-bold hover:scale-105 transition-transform">
                Lancer le Refactor Lead-Gen
              </button>
              <button className="bg-white text-navy border border-slate-200 px-8 py-4 rounded-xl font-bold hover:bg-slate-50 transition-colors">
                Voir la Roadmap Complète
              </button>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>

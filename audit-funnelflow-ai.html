
<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Stratégique — FunnelFlow AI</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0F172A;
      --gold: #C7A436;
      --danger: #EF4444;
      --success: #10B981;
      --canvas: #F8FAFC;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--canvas);
      color: var(--navy);
      overflow-x: hidden;
    }
    h1, h2, h3 { font-family: 'Sora', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(15, 23, 42, 0.08);
    }
    .badge-critical { background: #FEE2E2; color: #991B1B; border: 1px solid #F87171; }
    .badge-fragile { background: #FEF3C7; color: #92400E; border: 1px solid #FBBF24; }
    .badge-ok { background: #D1FAE5; color: #065F46; border: 1px solid #34D399; }
    .sh-premium { box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.12); }
    .code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const StatusCard = ({ title, score, status, desc, items }) => (
      <div className="glass rounded-2xl p-6 sh-premium flex flex-col gap-4 animate-up">
        <div className="flex justify-between items-start">
          <h3 className="font-extrabold text-xl tracking-tight">{title}</h3>
          <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest ${status === 'CRITIQUE' ? 'badge-critical' : status === 'FRAGILE' ? 'badge-fragile' : 'badge-ok'}`}>
            {status}
          </span>
        </div>
        <div className="flex items-baseline gap-2">
          <span className="text-4xl font-black">{score}</span>
          <span className="text-slate-400 font-bold">/ 10</span>
        </div>
        <p className="text-sm text-slate-600 leading-relaxed font-medium">{desc}</p>
        <div className="space-y-2 mt-2 border-t border-slate-100 pt-4">
          {items.map((item, i) => (
            <div key={i} className="flex items-center gap-3 text-sm">
              <span className={`w-2 h-2 rounded-full flex-shrink-0 ${item.fail ? 'bg-danger' : 'bg-success'}`} />

        <div className="bg-slate-900 p-4 flex justify-between items-center">

          <span className="text-gold text-[10px] font-black tracking-widest uppercase bg-gold/10 px-2 py-1 rounded">Impact: {impact}</span>
        </div>
        <div className="grid md:grid-cols-2 divide-x divide-slate-100">
          <div className="p-5">
            <span className="text-[10px] font-black text-slate-400 uppercase block mb-3">État Actuel (Problématique)</span>
            <pre className="code text-red-600 bg-red-50 p-4 rounded-lg overflow-x-auto text-xs leading-relaxed">
              {before}
            </pre>
          </div>
          <div className="p-5 bg-slate-50/50">
            <span className="text-[10px] font-black text-green-600 uppercase block mb-3">Solution Recommandée</span>
            <pre className="code text-green-700 bg-green-50 p-4 rounded-lg overflow-x-auto text-xs leading-relaxed">

              </div>
              <h1 className="text-5xl font-black text-navy leading-none mb-4">

                <span className="text-slate-400">Vers le Niveau Industriel.</span>
              </h1>
              <p className="text-slate-500 max-w-xl text-lg font-medium leading-relaxed">

              </p>
            </div>
            <div className="glass p-5 rounded-3xl text-center min-w-[200px] sh-premium animate-up">
              <div className="text-[10px] font-black text-slate-400 uppercase mb-1">Score de Robustesse</div>
              <div className="text-5xl font-black text-navy">6.2</div>
              <div className="w-full bg-slate-200 h-2 rounded-full mt-3 overflow-hidden">
                <div className="bg-gold h-full w-[62%] transition-all duration-1000 ease-out" />
              </div>
              <div className="text-[10px] text-slate-400 mt-2 font-bold uppercase tracking-wider">Passable (Besoin Refactor)</div>
            </div>
          </header>

          {/* Key Metrics Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-16">
            <StatusCard 
              title="Capture de Leads"
              score="2.0"
              status="CRITIQUE"
              desc="Le système actuel simule la capture mais ne stocke rien. C'est un 'vendeur sans carnet' : vos clients perdent 100% de leur trafic après export."

                { text: "Absence de sync CRM externe", fail: true },
                { text: "Structure Formulaire OK", fail: false }

            />
            <StatusCard 
              title="Export Systeme.io"
              score="5.5"
              status="FRAGILE"
              desc="Le code est propre et scopé, mais les redirections cassent au moment de l'import car les slugs ne sont pas mappés dynamiquement."
              items={[
                { text: "CSS scopé .ff-page", fail: false },
                { text: "Redirections statiques (404)", fail: true },
                { text: "Multi-pasting chronophage", fail: true }
              ]}
            />
            <StatusCard 
              title="Qualité Génération IA"
              score="7.8"
              status="SOLIDE"
              desc="Les prompts sont riches mais manquent de 'Morsure'. Le ton est parfois trop scolaire pour des entrepreneurs coachs à haute autorité."
              items={[
                { text: "Logique sémantique par rôle", fail: false },

                { text: "Manque d'autorité d'expert", fail: true }

            />

                Le tunnel casse dès le premier clic. L'utilisateur doit modifier manuellement chaque bouton. 
              </p>
              <RefactorBlock 
                title="Gestion des Liens Dynamiques (Refactor)"
                before={`// lib/funnels/cta.ts\nexport function ctaHref(cta) {\n  if (cta.mode === "redirect") {\n    return cta.url; // Mortel après export !\n  }\n  return "#lead-form";\n}`}
                after={`// lib/funnels/cta.ts\nexport function ctaHref(cta, isExport) {\n  if (isExport && cta.targetNextStep) {\n    // Utilise le placeholder natif de S.io\n    return "{{next_step_url}}"; \n  }\n  return cta.url;\n}`}
                impact="Majeur (Expérience utilisateur)"
              />
            </div>
          </section>

          {/* Deep Dive 02 */}
          <section className="mb-20 animate-up" style={{animationDelay: '0.3s'}}>
            <h2 className="text-3xl font-black mb-8 flex items-center gap-4 text-navy">
              <span className="w-10 h-10 rounded-2xl bg-navy text-white flex items-center justify-center text-sm font-black">02</span>

            <div className="grid lg:grid-cols-2 gap-10">

                      <span>Migration immédiate vers <strong>Supabase Table 'leads'</strong>.</span>
                    </li>
                    <li className="flex gap-4 text-sm font-bold">
                      <span className="w-6 h-6 rounded-full bg-gold text-white flex items-center justify-center text-[10px] flex-shrink-0">2</span>
                      <span>Intégration d'un <strong>Webhook sortant</strong> (Zapier/Make) pour automatiser la relance.</span>

                    <li className="flex gap-4 text-sm font-bold">
                      <span className="w-6 h-6 rounded-full bg-gold text-white flex items-center justify-center text-[10px] flex-shrink-0">3</span>

                </div>
                <h4 className="font-black text-xl text-navy mb-3">Risque de Perte de Données</h4>
                <p className="text-sm text-slate-500 max-w-xs leading-relaxed">
                  Si l'utilisateur n'a pas configuré sa propre plateforme, FunnelFlow doit agir comme un **coffre-fort temporaire**. Aujourd'hui, les données s'évaporent.
                </p>
              </div>
            </div>
          </section>

          {/* AI Generation Authority */}
          <section className="mb-20 animate-up" style={{animationDelay: '0.4s'}}>
            <h2 className="text-3xl font-black mb-8 flex items-center gap-4 text-navy">

            <div className="bg-slate-900 rounded-[2.5rem] p-10 text-white sh-premium overflow-hidden relative">
              <div className="absolute top-0 right-0 w-64 h-64 bg-gold opacity-10 blur-[100px] -mr-32 -mt-32" />
              <div className="grid md:grid-cols-2 gap-16 relative z-10">
                <div>
                  <h3 className="text-3xl font-black mb-6 italic leading-tight">"Arrêtez de vendre le guide, <br/>vendez la transformation."</h3>
                  <p className="text-slate-400 mb-8 text-base leading-relaxed">
                    Les coachs ont besoin de <strong>crédibilité immédiate</strong>. Les prompts actuels manquent de nuances psychologiques.
                  </p>
                  <div className="space-y-4">
                    <div className="flex gap-5 p-5 rounded-2xl bg-white/5 border border-white/10">
                      <div className="text-danger font-black text-lg">✕</div>
                      <div className="text-sm">
                        <span className="font-black text-slate-500 uppercase text-[10px] block mb-1 tracking-widest">Style Actuel (Trop Hype)</span>
                        "Boostez vos revenus de 500% avec notre méthode révolutionnaire !"
                      </div>
                    </div>
                    <div className="flex gap-5 p-5 rounded-2xl bg-green-500/10 border border-green-500/20">
                      <div className="text-success font-black text-lg">✓</div>
                      <div className="text-sm">
                        <span className="font-black text-green-500 uppercase text-[10px] block mb-1 tracking-widest">Style Recommandé (Expert)</span>
                        "Le framework précis pour stabiliser votre cashflow sans sacrifier vos week-ends."
                      </div>
                    </div>
                  </div>
                </div>
                <div className="flex flex-col justify-center gap-6">
                  <div className="p-8 bg-white/5 rounded-3xl border border-white/10 backdrop-blur-sm">
                    <h4 className="text-gold font-black uppercase text-xs tracking-[0.2em] mb-4">Correction de Prompting</h4>
                    <div className="p-4 bg-slate-800 rounded-xl">
                      <pre className="code text-blue-300 text-xs whitespace-pre-wrap leading-relaxed italic">
                        {`"Agis comme un Mentor Senior. 
Utilise le framework PAS (Problem-Agitation-Solution). 
Interdis les superlatifs. Préfère les données froides. 
Adopte une posture d'autorité calme."`}
                      </pre>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Actionable Footer */}
          <footer className="mt-32 pt-16 border-t border-slate-200 flex flex-col items-center text-center animate-up">
            <h2 className="text-4xl font-black text-navy mb-6 leading-tight">Prêt à bâtir l'Indestructible ?</h2>
            <p className="text-slate-500 mb-10 max-w-xl text-lg font-medium leading-relaxed">
              Ces améliorations transformeront FunnelFlow AI d'un outil de génération en une **véritable usine à conversion** pour les entrepreneurs sérieux.
            </p>
            <div className="flex flex-col sm:flex-row gap-5">
              <button className="bg-navy text-white px-10 py-5 rounded-2xl font-black text-sm uppercase tracking-widest hover:scale-105 hover:shadow-2xl transition-all duration-300">
                Démarrer le Refactor Lead-Gen
              </button>
              <button className="bg-white text-navy border-2 border-slate-100 px-10 py-5 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-slate-50 transition-all">
                Voir la Roadmap 2026
              </button>
            </div>
            <div className="mt-16 text-slate-300 font-bold text-xs uppercase tracking-[0.4em]">
              FunnelFlow AI — Strategic Audit v1.0
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
